name: Build and Deploy Nexus to VPS

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  packages: write

env:
  # TTL защитного флага техобслуживания (в секундах). Должен с запасом
  # покрывать время между `docker compose up -d --force-recreate` и
  # моментом, когда StateCollector успеет опросить обновлённые контейнеры
  # хотя бы раз. Флаг истекает сам по себе — explicit DELETE не нужен.
  MAINTENANCE_TTL_SECONDS: "180"

jobs:
  # === ЛЕГКОВЕСНЫЙ ДЖОБ ТЕСТИРОВАНИЯ ===
  test:
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: "123456:fake_token_for_ci_tests"
      ADMIN_IDS: "12345678"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Устанавливаем dev-зависимости: используем файл, если он есть, иначе ставим точечно
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install pytest pytest-asyncio fakeredis
          fi

      - name: Run tests
        run: pytest

  # === СБОРКА ОБРАЗОВ (зависит от тестов) ===
  build-and-push:
    runs-on: ubuntu-latest
    needs: test  # Запуск только при успешном прохождении тестов
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Приведение имени владельца репозитория к нижнему регистру для тегов GHCR
      - name: Downcase repository owner
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "GHCR_IMAGE_NAME=ghcr.io/${OWNER_LOWER}/nexus" >> $GITHUB_ENV

      # Сборка основного приложения
      - name: Build and push Core Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.GHCR_IMAGE_NAME }}:latest

      # Сборка и отправка сайдкара туннеля (с синхронизацией вебхуков)
      - name: Build and push Tunnel Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./cloudflared
          push: true
          tags: ${{ env.GHCR_IMAGE_NAME }}-tunnel:latest

  # === ДЕПЛОЙ НА СЕРВЕР (зависит от сборки и тестов) ===
  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-push, test]
    steps:
      - name: Execute remote SSH commands to deploy Nexus
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          envs: MAINTENANCE_TTL_SECONDS
          script: |
            cd ~/apps/nexus
            OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            GHCR_IMAGE_NAME="ghcr.io/${OWNER_LOWER}/nexus"

            # Динамически прописываем или обновляем переменную GHCR_IMAGE_NAME в .env
            grep -q '^GHCR_IMAGE_NAME=' .env \
              && sed -i "s|^GHCR_IMAGE_NAME=.*|GHCR_IMAGE_NAME=${GHCR_IMAGE_NAME}|" .env \
              || echo "GHCR_IMAGE_NAME=${GHCR_IMAGE_NAME}" >> .env

            docker exec nexus-redis redis-cli SET nexus:maintenance:nexus 1 EX "${MAINTENANCE_TTL_SECONDS}" \
              || echo "::warning::Could not set maintenance flag (redis not up yet?), continuing anyway"

            # Обновляем образы и перезапускаем весь стек
            docker compose pull
            docker compose up -d --force-recreate

            # Очищаем неиспользуемые старые образы для экономии диска
            docker image prune -f