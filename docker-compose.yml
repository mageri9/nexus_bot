services:
  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nexus:
    # Использует собранный в GHCR образ. Если переменной нет, подставит дефолт
    image: ${GHCR_IMAGE_NAME:-ghcr.io/mageri9/nexus}:latest
    container_name: nexus-core
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/host_root:ro
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0

  webhook:
    # Использует тот же образ, но переопределяет команду запуска на uvicorn
    image: ${GHCR_IMAGE_NAME:-ghcr.io/mageri9/nexus}:latest
    container_name: nexus-webhook
    command: uvicorn webhook_service:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0

  # Бесплатный HTTPS-туннель для вебхуков
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: nexus-tunnel
    restart: unless-stopped
    command: tunnel --url http://webhook:8000
    depends_on:
      - webhook

volumes:
  redis_data: